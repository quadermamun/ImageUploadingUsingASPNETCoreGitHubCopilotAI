<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASP Core Web MVC - HTML5 Page</title>
  <meta name="description" content="Simple HTML5 page added to wwwroot" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 2rem; }
    header { border-bottom: 1px solid #ddd; padding-bottom: 1rem; margin-bottom: 1rem; }
    main { max-width: 800px; }
    footer { margin-top: 2rem; color: #666; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Welcome</h1>
    <p>This is a simple HTML5 page served from wwwroot/index.html.</p>
  </header>

  <main>
    <section>
      <h2>Getting started</h2>
      <p>If your app serves static files, navigate to <code>/index.html</code> or the site root to see this page.</p>
    </section>

    <section>
      <h2>Example</h2>
      <p>Replace this content with your own HTML, CSS and JavaScript.</p>
    </section>
  </main>

  <footer>
    <p>&copy; Your Company</p>
  </footer>

  <script>
    // Example script
    console.log('HTML5 page loaded');
  </script>
</body>
</html>
